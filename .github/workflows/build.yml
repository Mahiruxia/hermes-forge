name: Build Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build app
        run: npm run build

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis --publish never

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npx electron-builder --mac dmg zip --publish never

      - name: Smoke packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path release -Recurse -File -Filter "Hermes Forge.exe" | Select-Object -First 1
          if (-not $binary) { throw "Packaged Windows executable not found." }
          & $binary.FullName --system-audit
          if ($LASTEXITCODE -ne 0) { throw "Packaged Windows smoke audit failed with exit code $LASTEXITCODE." }

      - name: Smoke packaged macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          binary="$(find release -type f -path '*/Hermes Forge.app/Contents/MacOS/Hermes Forge' | head -n 1)"
          test -n "$binary"
          "$binary" --system-audit

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-forge-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release-artifacts/**/*
